[package]
name = "felinaut-cef-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Opt-in native CEF/GPUI lifecycle investigation, not a browser backend"

[workspace]
members = ["helper"]
default-members = ["."]
resolver = "2"

[features]
runtime = ["dep:cef", "dep:cef-dll-sys", "dep:raw-window-handle", "dep:url"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "=156.4.0", optional = true, default-features = false, features = [
    "sandbox",
    "resources",
] }
# Pin the sys/runtime pair too; cef's own dependency otherwise permits later wrappers.
cef-dll-sys = { version = "=156.4.0", optional = true, features = ["sandbox"] }
raw-window-handle = { version = "0.6.2", optional = true }
url = { version = "2.5", optional = true }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0
