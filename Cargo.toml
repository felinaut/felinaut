[package]
name = "felinaut"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust browser with GPUI chrome and native WebKit pages"
license = "MIT"
default-run = "felinaut"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
wry = { version = "=0.57.1", default-features = false, features = [
    "os-webview",
] }
url = "2.5"
unicode-segmentation = "1.12"
# Already used by GPUI; the agent control socket speaks JSON lines.
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by Wry; read the live native Reduce Motion setting without polling a subprocess,
# and the pointer position while it is over a native page (sidebar edge peek).
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
    "NSAccessibility",
    # Agent control: real mouse and keyboard events, and page snapshots.
    "NSEvent",
    # The key event monitor that gives Command+arrow keys to the page.
    "block2",
    "NSGraphicsContext",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
# Also already used by Wry; agent control calls WKWebView directly.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSProcessInfo",
    "NSRange",
    "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }

[[test]]
name = "native_webview"
harness = false

[[test]]
name = "brand_ui"
harness = false

[[test]]
name = "native_audio"
harness = false

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
