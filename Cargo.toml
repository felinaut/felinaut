[package]
name = "felifox"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust browser with GPUI chrome and native WebKit pages"
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
wry = { version = "=0.57.1", default-features = false, features = [
    "os-webview",
] }
url = "2.5"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by Wry; read the live native Reduce Motion setting without polling a subprocess.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
    "NSAccessibility",
] }

[[test]]
name = "native_webview"
harness = false

[[test]]
name = "brand_ui"
harness = false

[[test]]
name = "native_audio"
harness = false

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
