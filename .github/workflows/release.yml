name: Main prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No workflow-wide concurrency group: newer commits must not replace queued builds.
jobs:
  metadata:
    name: Determine semantic release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Derive a repeatable patch version from first-parent history
        id: version
        run: python3 scripts/release_version.py --github-output "$GITHUB_OUTPUT"

  build:
    name: Validate and build (${{ matrix.arch }})
    needs: [metadata]
    env:
      FELINAUT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust with validation tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Check full Xcode and Metal compiler
        run: |
          developer_dir="$(xcode-select -p)"
          test -d "$developer_dir/../.."
          test -f "$developer_dir/../../Contents/Info.plist"
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/dist/Cargo.toml --all --check
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/dist/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit tests
        run: |
          cargo test --locked --bins
          cargo test --locked --manifest-path tools/dist/Cargo.toml
      - name: Python packaging tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify ad-hoc signed app
        run: |
          cargo dist --app-only
          codesign --verify --deep --strict dist/Felinaut.app
          lipo dist/Felinaut.app/Contents/MacOS/felinaut -verify_arch '${{ matrix.arch }}'
      - name: ZIP native app for universal assembly
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          version = os.environ['FELINAUT_RELEASE_VERSION']
          short = subprocess.check_output(['git', 'rev-parse', '--short=12', 'HEAD'], text=True).strip()
          name = f"Felinaut-{version}-{short}-macos-{os.environ['ARCH']}.zip"
          Path('release-assets').mkdir()
          subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                          'dist/Felinaut.app', f'release-assets/{name}'], check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: native-macos-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  universal:
    name: Assemble and verify universal app
    needs: [metadata, build]
    env:
      FELINAUT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: native-macos-arm64
          path: native-zips/arm64
      - uses: actions/download-artifact@v8
        with:
          name: native-macos-x86_64
          path: native-zips/x86_64
      - name: Merge fresh native builds and re-sign every architecture
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          version = os.environ['FELINAUT_RELEASE_VERSION']
          short = subprocess.check_output(['git', 'rev-parse', '--short=12', 'HEAD'], text=True).strip()
          for arch in ('arm64', 'x86_64'):
              directory = Path('native-zips') / arch
              name = f'Felinaut-{version}-{short}-macos-{arch}.zip'
              if {p.name for p in directory.iterdir()} != {name}:
                  raise RuntimeError(f'Missing or unexpected native {arch} build artifacts')
              destination = Path('native-apps') / arch
              destination.mkdir(parents=True)
              subprocess.run(['ditto', '-x', '-k', str(directory / name), str(destination)],
                             check=True, timeout=120)
          Path('release-assets').mkdir()
          name = f'Felinaut-{version}-{short}-macos-universal.zip'
          subprocess.run(['python3', 'scripts/assemble_universal_macos.py',
                          '--arm64', 'native-apps/arm64/Felinaut.app',
                          '--x86-64', 'native-apps/x86_64/Felinaut.app',
                          '--output', f'release-assets/{name}'], check=True, timeout=600)
          for arch in ('arm64', 'x86_64'):
              name = f'Felinaut-{version}-{short}-macos-{arch}.zip'
              shutil.copy2(Path('native-zips') / arch / name, Path('release-assets') / name)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-all
          path: release-assets/*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish complete prerelease
    if: github.ref == 'refs/heads/main'
    needs: [metadata, universal]
    # Serialize duplicate publications without blocking other release versions.
    concurrency:
      group: "publish-${{ needs.metadata.outputs.tag }}"
      cancel-in-progress: false
    env:
      FELINAUT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      FELINAUT_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: release-macos-all
          path: release-assets
      - name: Require all three release ZIPs and checksum them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from release_version import verify_release_tag

          version = os.environ['FELINAUT_RELEASE_VERSION']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          short = subprocess.check_output(['git', 'rev-parse', '--short=12', 'HEAD'], text=True).strip()
          assets = Path('release-assets')
          expected = {f'Felinaut-{version}-{short}-macos-{arch}.zip'
                      for arch in ('arm64', 'x86_64', 'universal')}
          if {p.name for p in assets.iterdir()} != expected:
              raise RuntimeError('Missing or unexpected release assets')
          tag = os.environ['FELINAUT_RELEASE_TAG']
          if tag != f'v{version}':
              raise RuntimeError('Release tag and version disagree')
          verify_release_tag(os.environ['GITHUB_REPOSITORY'], tag, sha)
          lines = []
          for name in sorted(expected):
              with (assets / name).open('rb') as file:
                  digest = hashlib.file_digest(file, 'sha256').hexdigest()
              lines.append(f'{digest}  {name}\n')
          (assets / 'SHA256SUMS').write_text(''.join(lines))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG={tag}\nRELEASE_TITLE=Felinaut {version} ({short})\n')
          PY
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Create or resume draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Automated, native macOS builds from the commit targeted by this release.
          Download the universal ZIP for either Mac, or the smaller arm64 (Apple Silicon) or x86_64 (Intel) ZIP.
          The universal app contains both native architectures. Extract your chosen ZIP and move Felinaut.app into Applications.
          Verify the chosen ZIP against its SHA256SUMS entry before extracting.

          These apps have local ad-hoc signatures only: no Developer ID signing or Apple notarization.
          Gatekeeper may block downloaded builds. Only override the warning if you trust this source and commit.
          No Finder DMG, updater, or interactive native UI testing is provided by this workflow.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json; then
            if [ "$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" = False ]; then
              echo "This commit already has a published release; leaving its assets unchanged."
              exit 0
            fi
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path('release-state.json').read_text())
          if state.get('targetCommitish') != os.environ['GITHUB_SHA']:
              raise RuntimeError('Existing draft does not target this exact source commit; refusing to upload')
          PY
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --draft --prerelease \
              --generate-notes --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
