      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C5B6E9"/>
    </linearGradient>
    <linearGradient id="glass" x1="22" y1="9" x2="42" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CEFAFF"/><stop offset="1" stop-color="#55C7D6"/>
    </linearGradient>
    <linearGradient id="fur" x1="25" y1="18" x2="39" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBF71"/><stop offset="1" stop-color="#F3944F"/>
    </linearGradient>
  </defs>
