<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Felinaut astronaut cat symbol</title>
  <desc>Felinaut, the happy female orange-and-cream explorer cat, has pointed ears and joyful crescent eyes inside a round cyan astronaut helmet. One open smile and a tiny tongue keep her face welcoming. A white and lavender rim and compact neck seal preserve the silhouette at small sizes. Original vector artwork on transparency.</desc>
