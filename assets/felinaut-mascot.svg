<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" fill="none">
  <title>Felinaut — curiosity, in orbit</title>
  <desc>Felinaut is a happy female orange-and-cream tabby astronaut and curious explorer. She reaches a rounded padded paw toward a colorful cross-wound wool planet, while a second little yarn ball trails a thread toward her other paw. A round cyan bubble helmet frames visible ears, joyful crescent eyes and one open smile. Her white and lavender suit has a paw-and-star patch, rounded boots and a life-support pack; a striped tail, orbital threads and small stars complete the transparent illustration.</desc>
  <defs>
    <linearGradient id="shell" x1="192" y1="208" x2="330" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".54" stop-color="#F5F2FF"/><stop offset="1" stop-color="#D6CCF4"/>
    </linearGradient>
    <linearGradient id="rim" x1="194" y1="49" x2="331" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F0EDFF"/><stop offset="1" stop-color="#B7A6E2"/>
    </linearGradient>
    <linearGradient id="visor" x1="204" y1="61" x2="319" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6FDFF"/><stop offset=".5" stop-color="#89E4EE"/><stop offset="1" stop-color="#42BCCC"/>
    </linearGradient>
    <linearGradient id="fur" x1="219" y1="90" x2="297" y2="227" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC16F"/><stop offset=".56" stop-color="#FFA252"/><stop offset="1" stop-color="#EB8149"/>
    </linearGradient>
    <linearGradient id="cream" x1="234" y1="177" x2="275" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E9"/><stop offset="1" stop-color="#FFE4B9"/>
    </linearGradient>
    <linearGradient id="reflection" x1="190" y1="65" x2="309" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".36"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="80" y1="335" x2="480" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99BE5"/><stop offset=".5" stop-color="#79DCE7"/><stop offset="1" stop-color="#D4B1F3"/>
    </linearGradient>
    <linearGradient id="woolWarm" x1="426" y1="49" x2="480" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD987"/><stop offset=".4" stop-color="#FF96AF"/><stop offset=".76" stop-color="#E46AC5"/><stop offset="1" stop-color="#9575DA"/>
    </linearGradient>
    <linearGradient id="woolCool" x1="72" y1="220" x2="113" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2FAE7"/><stop offset=".45" stop-color="#73D8E7"/><stop offset="1" stop-color="#9987E1"/>
    </linearGradient>
    <clipPath id="woolWarmClip"><circle cx="453" cy="81" r="38"/></clipPath>
    <clipPath id="woolCoolClip"><circle cx="92" cy="242" r="28"/></clipPath>
  </defs>

